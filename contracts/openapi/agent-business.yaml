openapi: 3.0.3
info:
  title: Travel Planning Agent Business Contract
  version: agent-contract-v1
  description: Java gateway to Python Agent REST contract. Gateway injects system fields and persists results.
servers:
  - url: /api
paths:
  /v1/tasks/{taskId}/steps/{stepId}/agent-results:
    post:
      operationId: submitAgentResult
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: stepId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentResultRequest' }
      responses:
        '202':
          description: Result accepted and persisted by Java
          content: { application/json: { schema: { $ref: '#/components/schemas/AgentResultAck' } } }
        '400':
          description: Invalid input or contract violation
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '409':
          description: Duplicate request or revision base mismatch
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '504':
          description: Agent deadline exceeded
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
components:
  schemas:
    AgentResultRequest:
      type: object
      additionalProperties: false
      required: [schema_version, task_id, step_id, agent_id, trace_id, request_id, generated_at, status, source_metadata]
      properties:
        schema_version: { type: string, pattern: '^agent-contract-v[0-9]+$' }
        task_id: { type: string, minLength: 1 }
        step_id: { type: string, minLength: 1 }
        agent_id: { type: string, minLength: 1 }
        trace_id: { type: string, minLength: 1 }
        request_id: { type: string, minLength: 1 }
        generated_at: { type: string, format: date-time }
        status: { type: string, enum: [ok, partial, degraded, failed] }
        message: { type: string, minLength: 1 }
        error_code: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
        degraded_fields: { type: array, minItems: 1, items: { type: string } }
        result:
          type: object
          additionalProperties: true
          description: Required for ok/partial/degraded; omitted for failed. Validated against the selected Agent output schema before submission.
        source_metadata: { type: array, items: { $ref: '#/components/schemas/SourceMetadata' } }
    AgentResultAck:
      type: object
      required: [task_id, step_id, request_id, persisted, status]
      properties:
        task_id: { type: string }
        step_id: { type: string }
        request_id: { type: string }
        persisted: { type: boolean, enum: [true] }
        status: { type: string, enum: [accepted, duplicate] }
    SourceMetadata:
      type: object
      additionalProperties: false
      required: [source_type, source_record_id, retrieved_at]
      properties:
        source_type: { type: string, enum: [map, weather, knowledge_base, reservation_rule, poi, user_input, system] }
        source_record_id: { type: string, minLength: 1 }
        retrieved_at: { type: string, format: date-time }
        valid_until: { type: string, format: date-time, nullable: true }
        freshness_status: { type: string, enum: [fresh, stale, unknown] }
        is_estimated: { type: boolean }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error_code, message, request_id]
      properties:
        error_code: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
        message: { type: string, minLength: 1 }
        request_id: { type: string, minLength: 1 }
        retryable: { type: boolean }
