openapi: 3.0.3
info:
  title: 公共认证与积分接口
  version: s08-v1
  description: S08 公共后端接口。访问令牌短期有效，刷新令牌只在服务端保存哈希。
servers:
  - url: /api
paths:
  /v1/auth/register:
    post:
      operationId: register
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } } }
      responses: { '200': { description: 注册并签发令牌, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }, '400': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' } }
  /v1/auth/login:
    post:
      operationId: login
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses: { '200': { description: 登录成功, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }, '401': { $ref: '#/components/responses/Problem' }, '423': { $ref: '#/components/responses/Problem' }, '429': { $ref: '#/components/responses/Problem' } }
  /v1/auth/refresh:
    post:
      operationId: refresh
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RefreshRequest' } } } }
      responses: { '200': { description: 刷新成功并轮换旧令牌, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }, '401': { $ref: '#/components/responses/Problem' } }
  /v1/auth/logout:
    post:
      operationId: logout
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RefreshRequest' } } } }
      responses: { '200': { description: 退出成功 }, '401': { $ref: '#/components/responses/Problem' } }
  /v1/auth/me:
    get:
      operationId: currentUser
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: 当前用户, content: { application/json: { schema: { $ref: '#/components/schemas/CurrentUser' } } } }, '401': { $ref: '#/components/responses/Problem' } }
  /v1/points/quotes:
    post:
      operationId: createPointsQuote
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QuoteRequest' } } } }
      responses: { '200': { description: 服务端计价报价, content: { application/json: { schema: { $ref: '#/components/schemas/QuoteResponse' } } } }, '401': { $ref: '#/components/responses/Problem' }, '404': { $ref: '#/components/responses/Problem' } }
  /v1/points/reserve:
    post:
      operationId: reservePoints
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReserveRequest' } } } }
      responses: { '200': { description: 预扣结果, content: { application/json: { schema: { $ref: '#/components/schemas/PointsResponse' } } } }, '409': { $ref: '#/components/responses/Problem' } }
  /v1/points/confirm:
    post:
      operationId: confirmPoints
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SettlementRequest' } } } }
      responses: { '200': { description: 零金额确认, content: { application/json: { schema: { $ref: '#/components/schemas/PointsResponse' } } } }, '409': { $ref: '#/components/responses/Problem' } }
  /v1/points/refund:
    post:
      operationId: refundPoints
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SettlementRequest' } } } }
      responses: { '200': { description: 全额退款, content: { application/json: { schema: { $ref: '#/components/schemas/PointsResponse' } } } }, '409': { $ref: '#/components/responses/Problem' } }
  /v1/points/grant:
    post:
      operationId: grantPoints
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GrantRequest' } } } }
      responses: { '200': { description: 管理员赠送积分, content: { application/json: { schema: { $ref: '#/components/schemas/PointsResponse' } } } }, '403': { $ref: '#/components/responses/Problem' } }
  /v1/points/balance:
    get:
      operationId: pointsBalance
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: 当前余额, content: { application/json: { schema: { $ref: '#/components/schemas/BalanceResponse' } } } }, '401': { $ref: '#/components/responses/Problem' } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
  responses:
    Problem:
      description: 统一问题详情
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [login, password]
      properties: { login: { type: string, minLength: 1, maxLength: 320 }, password: { type: string, minLength: 12, maxLength: 128 }, role: { type: string, enum: [USER] } }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login, password]
      properties: { login: { type: string }, password: { type: string } }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties: { refreshToken: { type: string, minLength: 64 } }
    TokenResponse:
      type: object
      required: [accessToken, refreshToken, expiresInSeconds, userId, role]
      properties: { accessToken: { type: string }, refreshToken: { type: string }, expiresInSeconds: { type: integer, minimum: 1 }, userId: { type: string, format: uuid }, role: { type: string, enum: [USER, ADMIN] } }
    CurrentUser:
      type: object
      required: [userId, login, role, status, createdAt]
      properties: { userId: { type: string, format: uuid }, login: { type: string }, role: { type: string, enum: [USER, ADMIN] }, status: { type: string }, createdAt: { type: string, format: date-time } }
    QuoteRequest:
      type: object
      additionalProperties: false
      required: [planCount]
      properties: { planCount: { type: integer, minimum: 1, maximum: 3 }, taskId: { type: string, format: uuid, nullable: true } }
    QuoteResponse:
      type: object
      required: [quoteId, quoteReference, planCount, points, expiresAtEpochSecond]
      properties: { quoteId: { type: string, format: uuid }, quoteReference: { type: string }, planCount: { type: integer, minimum: 1, maximum: 3 }, points: { type: integer, minimum: 1 }, expiresAtEpochSecond: { type: integer } }
    ReserveRequest:
      type: object
      additionalProperties: false
      required: [quoteReference]
      properties: { quoteReference: { type: string }, taskId: { type: string, format: uuid, nullable: true } }
    SettlementRequest:
      type: object
      additionalProperties: false
      required: [reservationReference]
      properties: { reservationReference: { type: string } }
    GrantRequest:
      type: object
      additionalProperties: false
      required: [userId, points]
      properties: { userId: { type: string, format: uuid }, points: { type: integer, minimum: 1 } }
    PointsResponse:
      type: object
      required: [businessReference, pointsDelta, balancePoints, reused]
      properties: { businessReference: { type: string }, pointsDelta: { type: integer }, balancePoints: { type: integer, minimum: 0 }, reused: { type: boolean } }
    BalanceResponse:
      type: object
      required: [balancePoints]
      properties: { balancePoints: { type: integer, minimum: 0 } }
    ProblemDetail:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, code, traceId, timestamp]
      properties: { type: { type: string, format: uri }, title: { type: string }, status: { type: integer }, detail: { type: string }, code: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }, traceId: { type: string }, timestamp: { type: string, format: date-time } }
