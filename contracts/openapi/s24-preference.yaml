openapi: 3.1.0
info:
  title: 历史行程与偏好记忆
  version: 0.1.0-draft
  description: >-
    S24 历史行程、偏好分析与偏好记忆库接口草案（R8 补充，对应 ALG-12）。
    统计维度 city/theme/pace/budget/season 由规则聚合产出，每条带可解释理由；
    LLM 仅生成自然语言文案；<3 条历史不出画像。
    行程版本列表与按版本读取补齐 PENDING-S21-01 / PENDING-S22-03，与同行程版本对比接口互补。
servers:
  - url: /api/v1
security:
  - bearer: []
paths:
  /history/trips:
    get:
      operationId: listHistoryTrips
      summary: 列出本人历史行程
      description: 按时间/城市/天数/状态筛选与搜索，仅返回本人行程。
      parameters:
        - {"name":"from","in":"query","required":false,"schema":{"type":"string","format":"date"}}
        - {"name":"to","in":"query","required":false,"schema":{"type":"string","format":"date"}}
        - {"name":"city","in":"query","required":false,"schema":{"type":"string","maxLength":128}}
        - {"name":"days","in":"query","required":false,"schema":{"type":"integer","minimum":1,"maximum":30}}
        - {"name":"status","in":"query","required":false,"schema":{"type":"string","enum":["DRAFT","ACTIVE","ARCHIVED"]}}
        - {"name":"q","in":"query","required":false,"schema":{"type":"string","maxLength":100}}
        - {"name":"limit","in":"query","required":false,"schema":{"type":"integer","minimum":1,"maximum":100,"default":20}}
        - {"name":"offset","in":"query","required":false,"schema":{"type":"integer","minimum":0,"maximum":10000,"default":0}}
      responses:
        '200':
          description: 请求成功
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {"type":"array","items":{"$ref":"#/components/schemas/HistoricalTrip"}}
        default:
          $ref: './s08-public.yaml#/components/responses/Problem'
  /trips/{tripId}/reuse:
    post:
      operationId: reuseTrip
      summary: 再来一单
      description: 拷贝为本人新草稿，去除私密偏好与精确住宿信息。
      parameters:
        - {"name":"tripId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
        - {"name":"Idempotency-Key","in":"header","required":true,"schema":{"type":"string","pattern":"^[A-Za-z0-9._:-]{1,128}$"}}
      responses:
        '201':
          description: 已生成新草稿
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReuseResult'}
        default:
          $ref: './s08-public.yaml#/components/responses/Problem'
  /trips/{tripId}/versions/compare:
    get:
      operationId: compareTripVersions
      summary: 同行程版本演进对比
      description: >-
        对比同一行程两个版本快照的字段级差异，数据来自 trip_version 与 plan_snapshot，
        不新增采集。仅本人行程可见。from/to 省略时分别取最早与最新版本。
      parameters:
        - {"name":"tripId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
        - {"name":"from","in":"query","required":false,"schema":{"type":"string","format":"uuid"},"description":"起始版本 ID"}
        - {"name":"to","in":"query","required":false,"schema":{"type":"string","format":"uuid"},"description":"结束版本 ID"}
      responses:
        '200':
          description: 请求成功
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VersionComparison'}
        default:
          $ref: './s08-public.yaml#/components/responses/Problem'
  /preferences/summary:
    get:
      operationId: getPreferenceSummary
      summary: 读取本人偏好画像
      description: >-
        样本数 <3 时返回 eligible=false 且 dimensions 为空、narrative 为空；
        dimensions 由规则聚合产出，narrative 由 LLM 生成，仅本人可见。
      responses:
        '200':
          description: 请求成功
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PreferenceSummary'}
        default:
          $ref: './s08-public.yaml#/components/responses/Problem'
    delete:
      operationId: clearPreferenceSummary
      summary: 一键清空偏好画像
      description: 写 status=CLEARED 与 cleared_at，保留历史版本，不物理删除。
      parameters:
        - {"name":"Idempotency-Key","in":"header","required":true,"schema":{"type":"string","pattern":"^[A-Za-z0-9._:-]{1,128}$"}}
      responses:
        '204':
          description: 已清空
        default:
          $ref: './s08-public.yaml#/components/responses/Problem'
  /trips/{tripId}/versions:
    get:
      operationId: listTripVersions
      summary: 列出本人行程的已发布版本
      description: >-
        按 version_no 倒序返回。仅行程所有者或 ADMIN 可读；不存在、已删除或不属于调用者时
        统一返回 404 CONTEXT_NOT_FOUND，避免枚举他人行程。
      parameters:
        - {"name":"tripId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
        - {"name":"limit","in":"query","required":false,"schema":{"type":"integer","minimum":1,"maximum":100,"default":20}}
        - {"name":"offset","in":"query","required":false,"schema":{"type":"integer","minimum":0,"maximum":10000,"default":0}}
      responses:
        '200':
          description: 请求成功
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {"type":"array","items":{"$ref":"#/components/schemas/TripVersionSummary"}}
              examples:
                list:
                  $ref: '../examples/s24/versions.json'
        default:
          $ref: './s08-public.yaml#/components/responses/Problem'
  /trips/{tripId}/versions/{versionId}:
    get:
      operationId: getTripVersion
      summary: 按版本号读取行程内容
      description: >-
        返回该版本的完整 plan 与来源、降级字段，供跨会话版本时间线与版本 diff 使用。
        已发布版本不可原地修改；仅所有者或 ADMIN 可读。
      parameters:
        - {"name":"tripId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
        - {"name":"versionId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
      responses:
        '200':
          description: 请求成功
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VersionDetail'}
              examples:
                detail:
                  $ref: '../examples/s24/version-detail.json'
        default:
          $ref: './s08-public.yaml#/components/responses/Problem'
  /preferences/recall:
    get:
      operationId: recallPreferences
      summary: 按权重召回本人 TOP-K 偏好
      description: >-
        按遗忘后的有效权重倒序返回，作为 Agent 上下文的软约束来源；仅本人可见，不参与公共榜单。
        有效权重 = 原始权重 × 0.5^(距 lastUsedAt 的天数 / 半衰期)，并以保底权重截断；
        置信度低于阈值（app.preferences.min-confidence，默认 0.6）的偏好被过滤；
        召回条数 K 取 app.preferences.top-k（默认 5），上限取 app.preferences.top-k-max（默认 20）。
        上述默认值见 docs/alg-12-parameter-decision.md，状态为“已配置化，待 R1/R3 会签”，尚未定稿。
      parameters:
        - {"name":"top_k","in":"query","required":false,"description":"可选。不传时使用服务端配置 app.preferences.top-k；传入时按 app.preferences.top-k-max 截断，且不得超过契约上限 20。","schema":{"type":"integer","minimum":1,"maximum":20,"default":5}}
      responses:
        '200':
          description: 请求成功
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {"type":"array","items":{"$ref":"#/components/schemas/PreferenceItem"}}
              examples:
                recall:
                  $ref: '../examples/s24/recall.json'
        default:
          $ref: './s08-public.yaml#/components/responses/Problem'
components:
  schemas:
    HistoricalTrip:
      type: object
      required: [id, title, startDate, endDate, status, versionCount]
      properties:
        id: {type: string, format: uuid}
        title: {type: string, maxLength: 200}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date}
        status: {type: string, enum: [DRAFT, ACTIVE, ARCHIVED]}
        cities: {"type":"array","items":{"type":"string"},"description":"城市名列表"}
        versionCount: {type: integer, minimum: 1}
        currentVersionId: {type: string, format: uuid}
    VersionSummary:
      type: object
      required: [versionId, versionNo, versionStatus]
      properties:
        versionId: {type: string, format: uuid}
        versionNo: {type: integer, minimum: 1}
        versionStatus: {type: string, enum: [DRAFT, ACTIVE, ARCHIVED]}
        createdAt: {type: string, format: date-time}
        schemaVersion: {type: string}
    VersionChange:
      type: object
      required: [path, changeType]
      properties:
        path: {type: string, description: "字段路径，如 days[0].spots 或 budget"}
        changeType: {type: string, enum: [ADDED, REMOVED, MODIFIED]}
        before: {description: "旧值，新增时为 null"}
        after: {description: "新值，删除时为 null"}
    VersionComparison:
      type: object
      required: [tripId, from, to, changes]
      properties:
        tripId: {type: string, format: uuid}
        from: {$ref: '#/components/schemas/VersionSummary'}
        to: {$ref: '#/components/schemas/VersionSummary'}
        changes:
          type: array
          description: "按路径排序的字段差异，最多 200 条"
          items: {$ref: '#/components/schemas/VersionChange'}
    ReuseResult:
      type: object
      required: [tripId, versionId]
      properties:
        tripId: {type: string, format: uuid, description: 新草稿 ID}
        versionId: {type: string, format: uuid, description: 新草稿初始版本 ID}
        removedFields: {"type":"array","items":{"type":"string"},"description":"本次清理掉的私密字段键名，不含原值"}
    PreferenceItem:
      type: object
      required: [key, valueJson, sourceType, weight]
      properties:
        key: {type: string, maxLength: 64, description: 偏好键，如 city/theme/pace/budget}
        valueJson: {type: object, description: 偏好值，结构随 key 而定}
        sourceType: {type: string, enum: [EXPLICIT, HISTORY_ANALYSIS, SYSTEM]}
        confidence: {type: number, minimum: 0, maximum: 1, description: 置信度；维度基准值取 app.preferences.dimension-confidence / default-confidence，召回时低于 app.preferences.min-confidence（默认 0.6）的条目被过滤。默认值待 R1/R3 会签"}
        weight: {type: integer, description: 权重 = 统计命中条数 × app.preferences.weight-increment（默认 3），上限 app.preferences.weight-cap（默认 100）；召回接口返回遗忘折算后的有效权重，半衰期 app.preferences.decay-half-life-days（默认 180 天）。默认值待 R1/R3 会签"}
        lastUsedAt: {type: string, format: date-time}
        reason: {type: string, description: 可解释理由，说明该维度由何种历史数据统计得出"}
    PreferenceSummary:
      type: object
      required: [sampleCount, eligible, dimensions, narrative, summaryVersion]
      properties:
        summaryVersion: {type: integer, minimum: 1}
        sampleCount: {type: integer, minimum: 0}
        eligible: {type: boolean, description: 仅当 sampleCount>=3 可为 true}
        dimensions:
          type: array
          description: 规则聚合产出的统计维度，非 LLM 生成；维度清单取 app.preferences.dimensions（默认 city/theme/pace/budget/season）
          items: {$ref: '#/components/schemas/PreferenceItem'}
        narrative:
          type: string
          description: LLM 基于 dimensions 生成的自然语言画像文案；eligible=false 时为空
        generatedAt: {type: string, format: date-time}
    TripVersionSummary:
      type: object
      required: [versionId, tripId, versionNo, status, etag, contentHash, schemaVersion, createdAt, current]
      properties:
        versionId: {type: string, format: uuid}
        tripId: {type: string, format: uuid}
        versionNo: {type: integer, minimum: 1}
        parentVersionId:
          type: [string, "null"]
          format: uuid
          description: 首版为 null，其余指向上一版本
        status: {type: string, enum: [PUBLISHED, SUPERSEDED], description: 已发布版本不可原地修改}
        etag: {type: string, description: 大写十六进制内容摘要，用于并发校验}
        contentHash: {type: string, description: 大写十六进制 SHA-256 内容哈希}
        schemaVersion: {type: string}
        createdAt: {type: string, format: date-time}
        current: {type: boolean, description: 是否为行程当前版本}
        changeType:
          type: [string, "null"]
          enum: [UPDATE, ROLLBACK, null]
          description: 局部修改或回滚产生时给出，首次生成版本为 null
    VersionDetail:
      type: object
      required: [versionId, tripId, versionNo, status, etag, contentHash, schemaVersion, createdAt, current, plan, summary, sourceMetadata, degradedFields]
      properties:
        versionId: {type: string, format: uuid}
        tripId: {type: string, format: uuid}
        versionNo: {type: integer, minimum: 1}
        parentVersionId:
          type: [string, "null"]
          format: uuid
        status: {type: string, enum: [PUBLISHED, SUPERSEDED]}
        etag: {type: string}
        contentHash: {type: string}
        schemaVersion: {type: string}
        createdAt: {type: string, format: date-time}
        current: {type: boolean}
        changeType:
          type: [string, "null"]
          enum: [UPDATE, ROLLBACK, null]
        affectedPaths:
          type: array
          description: 该版本改动过的字段路径，仅局部修改或回滚版本有值
          items: {type: string}
        plan: {type: object, description: 已发布版本的行程内容，字段见 s19/plan.schema.json}
        summary: {type: object}
        sourceMetadata: {"type": "array", "items": {"type": "object"}}
        degradedFields: {"type": "array", "items": {"type": "string"}}
