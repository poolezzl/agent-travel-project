spring:
  application:
    name: agent-travel-backend
  profiles:
    default: local
  main:
    banner-mode: off
  datasource:
    url: "${DB_URL:jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:trip_planner}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&serverTimezone=UTC&forceConnectionTimeZoneToSession=true&connectionCollation=utf8mb4_unicode_ci}"
    username: "${DB_USERNAME:${MYSQL_USERNAME:trip_planner}}"
    password: "${DB_PASSWORD:${MYSQL_PASSWORD:}}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: "${DB_CONNECTION_TIMEOUT_MS:3000}"
      initialization-fail-timeout: "${DB_INITIALIZATION_FAIL_TIMEOUT_MS:1}"
  flyway:
    enabled: "${FLYWAY_ENABLED:true}"
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true

app:
  external-services:
    enabled: false
  adapters:
    mode: "${ADAPTER_MODE:mock}"
    amap-alias: "${AMAP_PROVIDER_ALIAS:amap}"
    qweather-alias: "${QWEATHER_PROVIDER_ALIAS:qweather}"
    llm-alias: "${LLM_PROVIDER_ALIAS:llm-mock}"
    timeout-ms: "${ADAPTER_TIMEOUT_MS:1500}"
    max-retries: "${ADAPTER_MAX_RETRIES:1}"
    retry-backoff-ms: "${ADAPTER_RETRY_BACKOFF_MS:20}"
    circuit-failure-threshold: "${ADAPTER_CIRCUIT_FAILURE_THRESHOLD:3}"
    circuit-open-seconds: "${ADAPTER_CIRCUIT_OPEN_SECONDS:10}"
    rate-limit-per-second: "${ADAPTER_RATE_LIMIT_PER_SECOND:20}"
    quota-per-window: "${ADAPTER_QUOTA_PER_WINDOW:1000}"
    quota-window-seconds: "${ADAPTER_QUOTA_WINDOW_SECONDS:86400}"
    route-cache-ttl-seconds: "${ADAPTER_ROUTE_CACHE_TTL_SECONDS:604800}"
    weather-cache-ttl-seconds: "${ADAPTER_WEATHER_CACHE_TTL_SECONDS:3600}"
    poi-cache-ttl-seconds: "${ADAPTER_POI_CACHE_TTL_SECONDS:2592000}"
    negative-cache-ttl-seconds: "${ADAPTER_NEGATIVE_CACHE_TTL_SECONDS:15}"
    cache-version: "${ADAPTER_CACHE_VERSION:v1}"
    connect-timeout-ms: "${ADAPTER_CONNECT_TIMEOUT_MS:1000}"
    http-max-response-bytes: "${ADAPTER_HTTP_MAX_RESPONSE_BYTES:1048576}"
    amap-base-url: "${AMAP_BASE_URL:https://restapi.amap.com}"
    amap-web-key: "${AMAP_WEB_KEY:}"
    qweather-api-host: "${QWEATHER_API_HOST:}"
    qweather-api-key: "${QWEATHER_API_KEY:}"
    qweather-forecast-days: "${QWEATHER_FORECAST_DAYS:3}"
    qweather-zone-id: "${QWEATHER_ZONE_ID:Asia/Shanghai}"
    cities:
      beijing:
        amap-adcode: "110000"
        amap-citycode: "010"
        qweather-location: "101010100"
      shanghai:
        amap-adcode: "310000"
        amap-citycode: "021"
        qweather-location: "101020100"
      hangzhou:
        amap-adcode: "330100"
        amap-citycode: "0571"
        qweather-location: "101210101"
      nanjing:
        amap-adcode: "320100"
        amap-citycode: "025"
        qweather-location: "101190101"
      suzhou:
        amap-adcode: "320500"
        amap-citycode: "0512"
        qweather-location: "101190401"
      chengdu:
        amap-adcode: "510100"
        amap-citycode: "028"
        qweather-location: "101270101"
      xian:
        amap-adcode: "610100"
        amap-citycode: "029"
        qweather-location: "101110101"
      chongqing:
        amap-adcode: "500000"
        amap-citycode: "023"
        qweather-location: "101040100"
      guangzhou:
        amap-adcode: "440100"
        amap-citycode: "020"
        qweather-location: "101280101"
      xiamen:
        amap-adcode: "350200"
        amap-citycode: "0592"
        qweather-location: "101230201"
  database:
    mode: mysql
    charset: utf8mb4
    timezone: UTC
    storage-engine: InnoDB
  security:
    jwt-secret: "${JWT_SECRET:}"
    access-token-seconds: "${ACCESS_TOKEN_SECONDS:900}"
    refresh-token-days: "${REFRESH_TOKEN_DAYS:30}"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    env:
      enabled: false

logging:
  level:
    root: INFO
    com.agenttravel.backend: INFO
