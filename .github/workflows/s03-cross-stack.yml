name: s03-cross-stack

on: [push, pull_request]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint, unit test, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Unit tests
        run: npm run test:unit
      - name: Mock build
        run: npm run build:mock
      - name: Local-profile build
        run: npm run build
      - name: Audit all frontend dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

  backend:
    name: Java build, tests, and Flyway check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend
        # 与 backend.yml 保持同一开关：fork 出的 JVM 与 jacoco agent 在 CI/沙箱内会互相冲突。
        # 必须在 backend/ 目录内执行：-DforkCount=0 时测试跑在 Maven 进程内，
        # S11ContractTests 以 user.dir 解析 ../contracts，工作目录必须是 backend/。
        run: mvn --batch-mode -DforkCount=0 verify
      - name: Cache NVD database
        # NVD 数据库体积大且首次同步慢，缓存到 runner 的 Maven 数据目录，后续 run 走增量更新。
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-data-${{ hashFiles('backend/pom.xml') }}
          restore-keys: nvd-data-
      - name: Dependency vulnerability scan
        # OWASP dependency-check 12.2.2 支持匿名访问 NVD，但匿名限速为 5 次/30 秒，
        # 默认速率会被判 429。这里把请求速率压到限速以下（每 8 秒 1 次 ≈ 3.75 次/30 秒）。
        # 配置了 Secret NVD_API_KEY 时自动改用密钥（限速 50 次/30 秒，同步更快）。
        # failBuildOnCVSS=11 表示只出报告不改构建结论（沿用本门禁既有语义）。
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          args=()
          if [ -n "${NVD_API_KEY}" ]; then
            args+=(-DnvdApiKey="${NVD_API_KEY}")
          else
            args+=(-Dnvd.api.delay=8000 -Dnvd.api.requestsperthirtyseconds=4)
          fi
          args+=(-Dnvd.api.retry.maxAttempts=4 -Dnvd.api.retry.delay=30000)
          mvn --batch-mode org.owasp:dependency-check-maven:12.2.2:check -DskipTestScope -DfailBuildOnCVSS=11 "${args[@]}"
      - name: Verify isolated MySQL 8 and Redis with local profile
        working-directory: .
        shell: pwsh
        run: ./scripts/s03_mysql_verify.ps1

  contracts:
    name: Schema and OpenAPI validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install contract validators
        run: python -m pip install --disable-pip-version-check jsonschema PyYAML openapi-spec-validator
      - name: Validate S02 schemas and examples
        run: python scripts/validate_s02_contracts.py
      - name: Validate OpenAPI document
        run: python -m openapi_spec_validator contracts/openapi/agent-business.yaml

  agent-service:
    name: Agent service checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify R4 project manifests
        shell: bash
        run: |
          test -f agent-service/pyproject.toml
          test -f agent-service/requirements.lock.txt
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install agent-service
        working-directory: agent-service
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
          python -m pip install --no-deps -e .
          python -m pip install build==1.6.1 pip-audit==2.10.1
      - name: Python build
        working-directory: agent-service
        run: python -m build
      - name: Ruff checks
        working-directory: agent-service
        run: |
          ruff format --check .
          ruff check .
      - name: Python tests
        working-directory: agent-service
        # pytest 临时目录改用 runner 工作目录下的 TMPDIR，避免宿主临时目录权限导致的删除失败。
        env:
          TMPDIR: ${{ runner.temp }}/agent-service-tmp
          TMP: ${{ runner.temp }}/agent-service-tmp
          TEMP: ${{ runner.temp }}/agent-service-tmp
        run: |
          mkdir -p "$TMPDIR"
          pytest -q --basetemp="$TMPDIR/pytest-basetemp"
      - name: Python dependency audit
        working-directory: agent-service
        # 仅豁免清单内显式登记的既有漏洞，其余新增漏洞仍会失败。
        run: |
          set -euo pipefail
          ignore_args=()
          while IFS= read -r raw_line; do
            vuln_id="${raw_line%%#*}"
            vuln_id="$(echo "$vuln_id" | tr -d '[:space:]')"
            if [ -z "$vuln_id" ]; then
              continue
            fi
            ignore_args+=(--ignore-vuln "$vuln_id")
          done < security/pip-audit-ignored-vulns.txt
          pip-audit -r requirements.lock.txt "${ignore_args[@]}"

  security:
    name: Secret and dependency manifest scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan committed files for high-confidence secrets
        shell: bash
        run: |
          if git grep -q -I -E '(-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,})' -- ':!*.lock'; then
            echo "Potential committed secret found"
            exit 1
          fi
      - name: Check dependency manifests are present
        shell: bash
        run: |
          test -f frontend/package-lock.json
          test -f backend/pom.xml
          test -f agent-service/pyproject.toml
          test -f agent-service/requirements.lock.txt
