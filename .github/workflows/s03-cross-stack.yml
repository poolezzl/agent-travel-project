name: s03-cross-stack

on: [push, pull_request]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint, unit test, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Unit tests
        run: npm run test:unit
      - name: Mock build
        run: npm run build:mock
      - name: Local-profile build
        run: npm run build
      - name: Audit all frontend dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

  backend:
    name: Java build, tests, and Flyway check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend
        run: mvn --batch-mode -f backend/pom.xml verify
      - name: Dependency vulnerability scan
        run: mvn --batch-mode -f backend/pom.xml org.owasp:dependency-check-maven:13.0.0:check -DskipTestScope
      - name: Verify isolated MySQL 8 empty database
        shell: pwsh
        run: ./scripts/s03_mysql_verify.ps1

  contracts:
    name: Schema and OpenAPI validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install contract validators
        run: python -m pip install --disable-pip-version-check jsonschema PyYAML openapi-spec-validator
      - name: Validate S02 schemas and examples
        run: python scripts/validate_s02_contracts.py
      - name: Validate OpenAPI document
        run: python -m openapi_spec_validator contracts/openapi/agent-business.yaml

  agent-service:
    name: Agent service checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify R4 project manifests
        shell: bash
        run: |
          test -f agent-service/pyproject.toml
          test -f agent-service/requirements.lock.txt
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install agent-service
        working-directory: agent-service
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
          python -m pip install --no-deps -e .
          python -m pip install build==1.6.1 pip-audit==2.10.1
      - name: Python build
        working-directory: agent-service
        run: python -m build
      - name: Ruff checks
        working-directory: agent-service
        run: |
          ruff format --check .
          ruff check .
      - name: Python tests
        working-directory: agent-service
        run: pytest -q
      - name: Python dependency audit
        working-directory: agent-service
        run: pip-audit -r requirements.lock.txt

  security:
    name: Secret and dependency manifest scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan committed files for high-confidence secrets
        shell: bash
        run: |
          if git grep -q -I -E '(-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,})' -- ':!*.lock'; then
            echo "Potential committed secret found"
            exit 1
          fi
      - name: Check dependency manifests are present
        shell: bash
        run: |
          test -f frontend/package-lock.json
          test -f backend/pom.xml
          test -f agent-service/pyproject.toml
          test -f agent-service/requirements.lock.txt
