name: Agent Service CI

on:
  push:
    paths:
      - "agent-service/**"
      - "agents/**"
      - "contracts/**"
      - "scripts/validate_s02_contracts.py"
      - ".github/workflows/agent-service-ci.yml"
  pull_request:
    paths:
      - "agent-service/**"
      - "agents/**"
      - "contracts/**"
      - "scripts/validate_s02_contracts.py"
      - ".github/workflows/agent-service-ci.yml"
  # 允许在路径过滤未命中时手工触发（例如改动只在 backend/ 或 frontend/）。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent-service/requirements.lock.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r agent-service/requirements.lock.txt
          python -m pip install --no-deps -e agent-service
          python -m pip install build==1.6.1 pip-audit==2.10.1

      - name: Validate S02 contracts
        run: python scripts/validate_s02_contracts.py

      - name: Build Agent Service package
        run: python -m build agent-service

      - name: Run Agent Service quality gate
        # pytest 的临时目录必须落在 runner 自有工作目录内：
        # 宿主默认临时目录的权限模型会让 pytest 清理 tmp_path 时报 PermissionError。
        env:
          TMPDIR: ${{ runner.temp }}/agent-service-tmp
          TMP: ${{ runner.temp }}/agent-service-tmp
          TEMP: ${{ runner.temp }}/agent-service-tmp
        run: |
          mkdir -p "$TMPDIR"
          python agent-service/scripts/quality_gate.py

      - name: Audit locked dependencies
        run: pip-audit -r agent-service/requirements.lock.txt
