name: backend

on:
  push:
    paths:
      - "backend/**"
      - "deploy/docker-compose.s03.yml"
      - "scripts/s03_mysql_verify.ps1"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "deploy/docker-compose.s03.yml"
      - "scripts/s03_mysql_verify.ps1"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend
        run: mvn --batch-mode verify
      - name: Check resolved dependencies
        run: mvn --batch-mode org.apache.maven.plugins:maven-dependency-plugin:3.8.1:tree -DoutputType=text
      - name: Verify isolated MySQL 8 empty database with local profile
        working-directory: .
        shell: pwsh
        run: ./scripts/s03_mysql_verify.ps1
      - name: Scan backend for committed secret literals
        working-directory: .
        shell: bash
        run: |
          if git grep -n -I -E '(password|api[_-]?key|token|secret)[[:space:]]*:[[:space:]]*["'"'][^$<{][^"'"']*["'"']' -- backend deploy scripts .github/workflows/backend.yml; then
            echo "Potential committed secret literal found in S03 validation assets"
            exit 1
          fi

  integration:
    # S24 集成测试需要一次性 MySQL 8：默认 mvn verify 不带 S24_IT，这些用例会长期处于跳过状态。
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: trip_planner_s24_it
          MYSQL_USER: s24_it
          MYSQL_PASSWORD: s24_it_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -p ci_root_pw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: backend
    env:
      S24_IT: "true"
      DB_URL: "jdbc:mysql://127.0.0.1:3306/trip_planner_s24_it?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&serverTimezone=UTC&forceConnectionTimeZoneToSession=true&connectionCollation=utf8mb4_unicode_ci"
      DB_USERNAME: s24_it
      DB_PASSWORD: s24_it_pw
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run S24 integration tests against MySQL 8
        run: mvn --batch-mode -DforkCount=0 -Dtest='S24*IntegrationTests' test
