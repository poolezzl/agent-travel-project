name: backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend
        run: mvn --batch-mode verify
      - name: Check resolved dependencies
        run: mvn --batch-mode org.apache.maven.plugins:maven-dependency-plugin:3.8.1:tree -DoutputType=text
      - name: Scan backend for committed secret literals
        working-directory: .
        shell: bash
        run: |
          if git grep -n -I -E '(password|api[_-]?key|token|secret)[[:space:]]*:[[:space:]]*["'"'][^$<{][^"'"']*["'"']' -- backend; then
            echo "Potential committed secret literal found under backend/"
            exit 1
          fi
